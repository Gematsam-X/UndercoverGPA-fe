<div class="connecting-overlay">
  <div class="connecting-modal">
    <h2>Connessione al server…</h2>

    <p>
      Sto stabilendo una connessione con il server. La connessione non può essere continua per
      mantenere l'app utilizzabile gratuitamente. Questo processo richiede mediamente intorno ai 25
      secondi.
    </p>

    <div class="timer">
      <span>{{ seconds }}</span> secondi trascorsi
    </div>

    <div class="loader"></div>
  </div>
</div>
