<div class="vote-container">
  <h2>Nuovo Voto 📝</h2>

  <!-- ===== SUBJECT (materia) ===== -->
  <label for="subject-select">Seleziona la materia:</label>
  <select id="subject-select" [(ngModel)]="selectedSubject" (change)="onSubjectChange()">
    <option [ngValue]="null" disabled selected hidden>-- Scegli la materia --</option>
    <option *ngFor="let s of subjects" [value]="s">{{ s }}</option>
  </select>

  <label for="custom-subject">Oppure inserisci un'altra materia:</label>
  <input
    id="custom-subject"
    type="text"
    [(ngModel)]="customSubject"
    (input)="onCustomSubjectChange()"
    placeholder="Scrivi la materia qui..."
    maxlength="60"
  />

  <!-- ===== EXAM TYPE ===== -->
  <div class="exam-type">
    <p class="small-label">Tipo di prova:</p>
    <label class="radio">
      <input type="radio" name="examType" [(ngModel)]="selectedExamType" value="scritta" /> Scritta
    </label>
    <label class="radio">
      <input type="radio" name="examType" [(ngModel)]="selectedExamType" value="pratica" /> Pratica
    </label>
    <label class="radio">
      <input type="radio" name="examType" [(ngModel)]="selectedExamType" value="orale" /> Orale
    </label>
  </div>

  <!-- ===== VOTE SELECT / CUSTOM ===== -->
  <label for="vote-select">Seleziona un voto:</label>
  <select id="vote-select" [(ngModel)]="selectedVote" (change)="onDropdownChange()">
    <option [ngValue]="null" disabled selected hidden>-- Scegli il voto --</option>
    <option *ngFor="let vote of votes" [ngValue]="vote">{{ vote.label }}</option>
  </select>

  <label for="custom-vote">Oppure inserisci un voto personalizzato (4-10):</label>
  <input
    type="number"
    id="custom-vote"
    [(ngModel)]="customVote"
    (input)="onCustomVoteChange()"
    min="4"
    max="10"
    step="0.01"
    placeholder="Inserisci un voto tra 4 e 10"
  />

  <!-- ===== MESSAGGIO DI FEEDBACK ===== -->
  <p class="feedback" [style.color]="voteMessageColor">{{ voteMessage }}</p>

  <!-- ===== PULSANTE INVIO ===== -->
  <button id="submitvote" (click)="submitVote()" [disabled]="isSubmitting">
    {{ buttonLabel }}
  </button>
</div>
