<div class="avg-circle animate-pop">
  <span class="avg-value">{{ average() }}</span>
  <p class="avg-label">
    @if (subject()) {<ng-container>{{ subject() }} </ng-container>} Media attuale
  </p>

  <button class="refresh-btn" (click)="refreshVotes()" [disabled]="isRefreshing()">
    @if (!isRefreshing()) {<fa-icon [icon]="faSync"></fa-icon>} @if (isRefreshing()) {<fa-icon
      class="rotating"
      [icon]="faSync"
    ></fa-icon
    >}
  </button>
</div>
