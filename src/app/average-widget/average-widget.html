<div class="avg-circle animate-pop">
  <div class="avg-content">
    @if (subject()) {
    <div #subjectEl class="avg-subject">
      {{ subject() }}
    </div>
    }

    <span class="avg-value">{{ average() }}</span>
    <div class="avg-label">Media attuale</div>

    <button class="refresh-btn" (click)="refreshVotes()" [disabled]="isRefreshing()">
      <fa-icon [class.rotating]="isRefreshing()" [icon]="faSync"></fa-icon>
    </button>
  </div>
</div>
