<div class="avg-circle animate-pop">
  <span class="avg-value">{{ average() }}</span>
  <p class="avg-label">
    <ng-container *ngIf="subject()">{{ subject() }} </ng-container>
    Media attuale
  </p>

  <button class="refresh-btn" (click)="refreshVotes()" [disabled]="isRefreshing()">
    @if (!isRefreshing()) {<fa-icon [icon]="faSync"></fa-icon>}
    @if (isRefreshing()) {<span class="spinner">⏳</span>}
  </button>
</div>
